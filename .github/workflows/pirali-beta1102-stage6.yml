name: PIRALI Beta 1.10.2 Stage 6 QA
on:
  push:
    branches:
      - main
    paths:
      - 'beta110-play/**'
      - 'beta110-dev/**'
      - 'qa/pirali-beta1102-stage6.cjs'
      - '.github/workflows/pirali-beta1102-stage6.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate stage 6 enemies and healing probabilities; check other levels
        run: node qa/pirali-beta1102-stage6.cjs
