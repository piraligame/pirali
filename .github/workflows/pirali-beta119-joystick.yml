name: PIRALI Beta 1.19 fixed joystick QA
on:
  push:
    branches: [feat/beta-1.19-fixed-joystick]
  workflow_dispatch:
jobs:
  joystick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test anchored joystick and preserved Beta 1.18 gameplay
        run: node qa/pirali-beta119-joystick.cjs
