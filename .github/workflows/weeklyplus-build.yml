name: WEEKLY+ Alpha 0.02 Android APK
on:
  push:
    branches: [weekly-plus-alpha002]
    paths-ignore: ['apks/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract and verify WEEKLY+ sources
        run: |
          cat .build/source.part* | base64 -d > /tmp/weeklyplus-source.tar.xz
          echo '0566a5bf04c79f3d0b762aa2cddb95b97f8a3d15a603a19264cdb579e9620ae6  /tmp/weeklyplus-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/weeklyplus-source.tar.xz
          sed -i 's/onClick={store.finishOnboarding}/onClick={store.finishOnboarding()}/g' app/src/main/java/ge/weeklyplus/app/MainActivity.kt
          sed -i -e 's/setDark/changeDark/g' -e 's/setEnglish/changeEnglish/g' -e 's/setReminderDefault/changeReminderDefault/g' -e 's/setQuietEnabled/changeQuietEnabled/g' app/src/main/java/ge/weeklyplus/app/*.kt
      - name: Apply WEEKLY+ Alpha 0.02 improvements
        run: |
          base64 -d .build/patch-alpha002.b64 | xz -d > /tmp/weeklyplus_patch.py
          python /tmp/weeklyplus_patch.py
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'InlineClock' app/src/main/java/ge/weeklyplus/app/MainActivity.kt
      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "sdkmanager path: $SDKM"
          test -n "$SDKM"
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK signature verification and signing tool
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n1)
          echo "APK signer: $SDKM"
          test -n "$SDKM"
          mkdir -p .build/signer
          cp "$(dirname "$SDKM")/lib/apksigner.jar" .build/signer/apksigner.jar
          test -s .build/signer/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: WEEKLY_PLUS_APKSIGNER_TOOL
          path: .build/signer/apksigner.jar
          if-no-files-found: error
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WEEKLY_PLUS_Alpha_0.02_Debug_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish standalone installable APK to branch
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk apks/WEEKLY_PLUS_Alpha_0.02.apk
          sha256sum apks/WEEKLY_PLUS_Alpha_0.02.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apks/WEEKLY_PLUS_Alpha_0.02.apk
          git commit -m "Build WEEKLY+ Alpha 0.02 installable Android APK" || exit 0
          git push
