name: PIRALI BETA 1.06 browser QA
on:
  push:
    branches: [main]
    paths:
      - 'qa/pirali-beta106-qa.cjs'
      - 'qa/pirali-beta106-extended.cjs'
      - '.github/workflows/pirali-beta106-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify published DEV and PLAYER on desktop and mobile
        run: |
          node qa/pirali-beta106-qa.cjs
          node qa/pirali-beta106-extended.cjs
