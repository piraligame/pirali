name: PIRALI Beta 1.23 gameplay regression
on:
  push:
    branches: [feat/beta-1.23-ai-stars-pickups]
  workflow_dispatch:
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both builds, smart AI, stage stars and glowing items
        run: node qa/pirali-beta123-regression.cjs
