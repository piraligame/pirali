name: PIRALI Beta 1.49 Overhead Shield Emblem QA
on:
  push:
    branches: [main]
    paths:
      - 'beta149-play/**'
      - 'beta149-dev/**'
      - 'scripts/prepare-android-beta149.cjs'
      - 'qa/pirali-beta149.cjs'
      - 'qa/pirali-beta149-browser.cjs'
      - '.github/workflows/pirali-beta149.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta149:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shield art and unchanged combat
        run: node qa/pirali-beta149.cjs
      - name: Verify unchanged Beta 1.48 camera
        run: node qa/pirali-beta148.cjs
      - name: Prepare unsigned Player-only Android web assets
        run: node scripts/prepare-android-beta149.cjs
      - name: Install Chromium for mobile web testing
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile Chromium Player and Developer game regressions
        run: node qa/pirali-beta149-browser.cjs
