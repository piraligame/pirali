name: PIRALI Beta 1.11 Stable Stage 7 QA
on:
  push:
    branches: [main]
    paths:
      - 'beta111-play/**'
      - 'beta111-dev/**'
      - 'qa/pirali-beta111-stage7-stability.cjs'
      - '.github/workflows/pirali-beta111-stage7-stability.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stage 7 balance and other 10 stages unchanged
        run: node qa/pirali-beta111-stage7-stability.cjs
