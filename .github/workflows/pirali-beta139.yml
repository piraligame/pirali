name: PIRALI Beta 1.39 Evolution and Compact Menu QA
on:
  push:
    branches: [main]
    paths:
      - 'beta139-play/**'
      - 'beta139-dev/**'
      - 'qa/pirali-beta139.cjs'
      - 'qa/pirali-beta139-browser.cjs'
      - '.github/workflows/pirali-beta139.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta139:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify progress unlock, no payment UI, and unchanged game mechanics
        run: node qa/pirali-beta139.cjs
      - name: Verify preserved Beta 1.38 baseline
        run: node qa/pirali-beta138.cjs
      - name: Verify preserved Beta 1.37 baseline
        run: node qa/pirali-beta137.cjs
      - name: Verify preserved Beta 1.36 baseline
        run: node qa/pirali-beta136.cjs
      - name: Verify preserved Beta 1.35 baseline
        run: node qa/pirali-beta135.cjs
      - name: Verify preserved Beta 1.34 baseline
        run: node qa/pirali-beta134.cjs
      - name: Verify preserved Beta 1.33 baseline
        run: node qa/pirali-beta133.cjs
      - name: Verify preserved Beta 1.32 baseline
        run: node qa/pirali-beta132.cjs
      - name: Verify preserved Beta 1.31 baseline
        run: node qa/pirali-beta131.cjs
      - name: Verify existing kill achievements
        run: node qa/pirali-beta125-milestones.cjs
      - name: Install Chromium for real mobile browser QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile Chromium Player and Developer smoke
        run: node qa/pirali-beta139-browser.cjs
