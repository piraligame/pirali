name: PIRALI BETA 1.08 big hearts QA
on:
  push:
    branches: [main]
    paths:
      - 'beta108-*/**'
      - 'qa/pirali-beta108-hearts.cjs'
      - '.github/workflows/pirali-beta108-hearts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta108-hearts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run BETA 1.08 DEV and PLAYER heart/checkpoint QA on desktop/mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pirali108-server.log 2>&1 &
          sleep 2
          node qa/pirali-beta108-hearts.cjs
