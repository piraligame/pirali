name: DIARY Play Store genuine app screenshots
on:
  push:
    branches: [diary-alpha004]
    paths: ['.github/workflows/diary-screenshots.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile actual Android app
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Run genuine app and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell settings put system font_scale 1.0
            adb shell settings put system time_12_24 24
            adb shell am start -n ge.weeklyplus.app/.MainActivity
            sleep 12
            mkdir -p play_store_assets/screenshots
            adb exec-out screencap -p > play_store_assets/screenshots/01_diary_today.png
            adb shell input tap 297 1840
            sleep 4
            adb exec-out screencap -p > play_store_assets/screenshots/02_diary_calendar.png
            adb shell input tap 523 1840
            sleep 4
            adb exec-out screencap -p > play_store_assets/screenshots/03_diary_goals.png
            adb shell input tap 740 1840
            sleep 4
            adb exec-out screencap -p > play_store_assets/screenshots/04_diary_insights.png
            adb shell dumpsys activity activities | grep -E 'mResumed|topResumed' | head -5 || true
            ls -lh play_store_assets/screenshots/
      - name: Upload screenshots for audit
        uses: actions/upload-artifact@v4
        with:
          name: DIARY_Real_Android_Screenshots_004
          path: play_store_assets/screenshots/*.png
          if-no-files-found: error
      - name: Save genuine screenshots in diary branch
        run: |
          git config user.name "diary-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play_store_assets/screenshots/*.png
          git commit -m "store(diary): capture real Android device screens for Play Console" || exit 0
          git push origin HEAD:diary-alpha004
