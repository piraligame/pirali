name: PIRALI Beta 1.16 joystick QA
on:
  push:
    branches:
      - feat/beta-1.16-balance
    paths:
      - 'beta116-play/**'
      - 'beta116-dev/**'
      - 'qa/pirali-beta116-joystick.cjs'
      - '.github/workflows/pirali-beta116-joystick.yml'
  pull_request:
    paths:
      - 'beta116-play/**'
      - 'beta116-dev/**'
      - 'qa/pirali-beta116-joystick.cjs'
      - '.github/workflows/pirali-beta116-joystick.yml'
  workflow_dispatch:
jobs:
  mobile-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immediate joystick movement for Player and Developer
        run: node qa/pirali-beta116-joystick.cjs
