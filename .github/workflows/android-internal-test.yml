name: Pirali Android Internal Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'js/**'
      - 'assets/**'
      - 'css/**'
      - 'data/**'
      - 'index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-android-web.cjs'
      - '.github/workflows/android-internal-test.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Build internal APK and unsigned AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runner Android SDK and accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install project packages
        run: npm ci
      - name: Build web assets from current game
        run: npm run build:android-web
      - name: Sync Capacitor with game assets
        run: npx cap sync android
      - name: Set Gradle executable bit
        run: chmod +x android/gradlew
      - name: Build debug APK and unsigned release AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Upload debug APK for internal testing
        uses: actions/upload-artifact@v4
        with:
          name: PIRALI-Internal-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned AAB preview (not Play-ready)
        uses: actions/upload-artifact@v4
        with:
          name: PIRALI-Unsigned-AAB-Preview
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
