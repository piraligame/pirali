name: PIRALI Beta 1.27.1 Auto Stats QA
on:
  push:
    branches: [main]
    paths:
      - 'beta1271-play/**'
      - 'beta1271-dev/**'
      - 'qa/pirali-beta1271.cjs'
      - 'qa/pirali-beta1271-browser.cjs'
      - '.github/workflows/pirali-beta1271.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta1271-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify auto save and Player Developer roles
        run: node qa/pirali-beta1271.cjs
      - name: Verify 100 and 500 kill milestones
        run: node qa/pirali-beta125-milestones.cjs
